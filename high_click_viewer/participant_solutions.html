<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Participant solutions</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="bg-shape bg-shape-1"></div>
    <div class="bg-shape bg-shape-2"></div>
    <main class="page wide">
      <a class="back-link" href="index.html">Back to participants</a>
      <header class="hero compact">
        <p class="eyebrow">Introspection Replay Viewer</p>
        <h1>Participant solutions</h1>
        <p class="subtitle">Solved puzzles, participant IDs, and the action paths they took.</p>
      </header>

      <section class="card gallery-toolbar">
        <div>
          <label class="semantic-label" for="solutionSearch">Search task id</label>
          <input id="solutionSearch" class="task-search" type="search" placeholder="e.g. 017c7c7b" autocomplete="off" />
        </div>
        <div class="filter-row" role="tablist" aria-label="Task set filter">
          <button class="filter-button is-active" data-filter="all" type="button">All</button>
          <button class="filter-button" data-filter="training" type="button">Training</button>
          <button class="filter-button" data-filter="evaluation" type="button">Evaluation</button>
        </div>
        <div class="filter-row" role="group" aria-label="Participant data filters">
          <button class="data-filter-button" data-participant-filter="complete" aria-pressed="false" type="button">Complete</button>
          <button class="data-filter-button" data-participant-filter="solved" aria-pressed="false" type="button">Solved</button>
          <button class="data-filter-button" data-participant-filter="attemptOne" aria-pressed="false" type="button">Attempt 1</button>
        </div>
        <p id="solutionStatus" class="gallery-status">Loading participant solutions...</p>
      </section>

      <section class="card solution-layout">
        <div>
          <h2>Selected task</h2>
          <div id="solutionDetail" class="gallery-detail">
            <p class="solution-empty">Choose a task card to load the participant solutions.</p>
          </div>
        </div>
        <div>
          <h2>Puzzle overview</h2>
          <div id="solutionGrid" class="task-grid"></div>
        </div>
      </section>
    </main>
    <script src="js/common.js"></script>
    <script src="js/participant_solutions.js"></script>
  </body>
</html>
